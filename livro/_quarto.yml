project:
  type: book
  output-dir: _book

book:
  title: "Material de Aulas — Turma 2026.1 ADS"
  subtitle: "Programação Orientada a Objetos"
  author: "Leandro Souza"
  date: today
  date-format: "DD/MM/YYYY"
  chapters:
    - index.qmd
    - 14_heranca.qmd
    - part: "Exercícios"
      chapters:
        - 21_Parcial2_generics.qmd
    - referencias.qmd
    - glossario.qmd

filters:
  - diagram

lang: pt-BR
bibliography: references.bib
csl: abnt.csl

format:
  typst:
    papersize: a4
    documentclass: book
    toc: true
    toc-title: "Sumário"
    lof: true
    lot: true
    number-sections: true
    fontsize: 12pt
    margin:
      left: 3cm
      top: 3cm
      right: 2cm
      bottom: 2cm
    include-in-header:
      text: |
        #set par(hanging-indent: 0pt)
        #show heading: it => {
          set par(hanging-indent: 0pt)
          block(it, above: 1.6em, below: 1em)
        }
        #set par(first-line-indent: 1.25cm, leading: 1em, justify: true)
        #show link: it => underline(text(fill: rgb("#1a56db"), it))

execute:
  freeze: auto
