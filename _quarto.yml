project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**"
    - "categorias/**"
  resources:
    - manifest.webmanifest
    - service-worker.js
    - icons/**
    - logo.svg

lang: pt-BR

website:
  title: "2026.1 ADS POO"
  description: "Material das Aulas"
  site-url: "https://leandro-costa.github.io/quarto-blog/"
  favicon: logo.svg
  repo-url: https://github.com/leandro-costa/quarto-blog
  page-navigation: true

  navbar:
    background: primary
    logo: logo.svg
    left:
      - href: index.qmd
        text: Blog
      - href: categorias/aulas.qmd
        text: Aulas
      - href: categorias/exercicios.qmd
        text: Exercícios
      - href: categorias/trabalhos.qmd
        text: Trabalho
      - href: categorias/entregas.qmd
        text: "Para Entrega"
    right:
      - href: livro-poo.pdf
        text: "Baixar PDF"
        icon: file-earmark-pdf
      - href: about.qmd
        text: Sobre
      - icon: github
        href: https://github.com/leandro-costa/quarto-blog

  page-footer:
    center: "Material de aula IFBA SAJ · Copyright © 2026 Leandro Souza"

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    css: styles.css
    toc: true
    code-copy: true
    code-tools: true
    highlight-style: github
    include-in-header: pwa-head.html

execute:
  freeze: auto    # não reexecuta código de posts antigos que não mudaram
  echo: true

editor: source
