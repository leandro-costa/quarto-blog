name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Git (desabilitar symlinks)
        run: git config --global core.symlinks false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Python/Jupyter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Jupyter e kernel IJava
        run: |
          pip install jupyter
          curl -L https://github.com/SpencerPark/IJava/releases/latest/download/ijava-1.3.0.zip -o ijava.zip
          unzip -q ijava.zip -d ijava
          python3 ijava/install.py --sys-prefix

      - name: Instalar PlantUML e Graphviz (para os diagramas)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          curl -L https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -o /usr/local/bin/plantuml.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/bin/plantuml.jar "$@"\n' | sudo tee /usr/local/bin/plantuml > /dev/null
          sudo chmod +x /usr/local/bin/plantuml

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Gerar capítulos do livro
        run: python3 scripts/generate-book.py

      - name: Render do site (blog)
        run: quarto render .

      - name: Versionar cache do service worker com o commit
        run: |
          SHA_CURTO=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/__COMMIT_SHA__/${SHA_CURTO}/" _site/service-worker.js

      - name: Render do livro (PDF via Typst)
        run: quarto render livro --to typst

      - name: Copiar PDF do livro para dentro do site
        run: cp livro/_book/*.pdf _site/livro-poo.pdf

      - name: Upload artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
