project:
  type: book
  output-dir: _book

book:
  title: "Material de Aulas — Turma 2026.1 ADS"
  subtitle: "Programação Orientada a Objetos"
  author: "Leandro Souza"
  date: today
  date-format: "DD/MM/YYYY"
  chapters:
    - capitulos/prefacio.qmd
    - capitulos/aula-14-heranca.qmd
    - part: "Exercícios"
      chapters:
        - capitulos/exercicio-21-generics.qmd
    - capitulos/referencias.qmd

format:
  typst:
    papersize: a4
    documentclass: book
    toc: true
    number-sections: true
    fontsize: 11pt
    margin:
      x: 2.5cm
      y: 2.5cm
    include-in-header:
      text: |
        // Corrige a numeração dos títulos (2.1, 2.1.1 etc.) para ficar
        // alinhada com a margem do texto, em vez de "pendurada" mais
        // próxima da borda da página.
        #set par(hanging-indent: 0pt)
        #show heading: it => {
          set par(hanging-indent: 0pt)
          block(it, above: 1.6em, below: 1em)
        }

execute:
  freeze: auto
