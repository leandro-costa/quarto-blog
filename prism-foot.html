<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
<script>
  // O Quarto/Pandoc gera algo como:
  //   <div class="sourceCode" id="cb1">
  //     <pre class="sourceCode java"><code class="sourceCode java">...</code></pre>
  //   </div>
  // A classe de linguagem (ex.: "java") fica no <pre>/<code>, não no <div>
  // externo — por isso lemos daqui. Removemos os <span> de destaque do
  // Pandoc (texto puro) e adicionamos as classes que o Prism espera
  // (language-xxx) para ele tokenizar/colorir do zero.
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("pre.sourceCode > code.sourceCode").forEach(function (codeEl) {
      var preEl = codeEl.parentElement;
      var classes = (preEl.className || "").split(/\s+/);
      var lang = classes.find(function (c) {
        return c && c !== "sourceCode";
      });

      var plainText = codeEl.textContent;
      codeEl.textContent = plainText;

      if (lang) {
        codeEl.className = "language-" + lang;
        preEl.className = "language-" + lang + " line-numbers";
      }
    });

    if (window.Prism) {
      Prism.highlightAll();
    }
  });
</script>
