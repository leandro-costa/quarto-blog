<!-- Core + gramáticas carregadas de forma síncrona e explícita -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
<script>
(function () {
  "use strict";

  function aplicarPrism() {
    // Seletores abrangentes: cobre tanto blocos Pandoc quanto Jupyter
    var seletores = [
      "pre.sourceCode code.sourceCode",
      "pre.sourceCode > code",
      "div.sourceCode pre code",
      "div.cell-code pre code",
      "pre > code[class*='language-']",
      "pre > code[class*='sourceCode']",
      "pre[class*='sourceCode'] > code",
      // Fallback: qualquer <pre><code> que pareça código
      "pre > code"
    ];

    var blocos = [];
    seletores.forEach(function (sel) {
      document.querySelectorAll(sel).forEach(function (el) {
        if (blocos.indexOf(el) === -1) blocos.push(el);
      });
    });

    if (!blocos.length) {
      console.log("[Prism] Nenhum bloco de código encontrado.");
      return;
    }

    console.log("[Prism] Blocos encontrados:", blocos.length);

    blocos.forEach(function (codeEl) {
      var preEl = codeEl.closest("pre");
      if (!preEl) return;

      // Já processado?
      if (preEl.dataset.prismApplied) return;
      preEl.dataset.prismApplied = "true";

      // Detectar linguagem
      var lang = null;

      // 1. Tentar extrair de data-lang (Quarto/Jupyter)
      if (preEl.dataset.lang) {
        lang = preEl.dataset.lang;
      }
      // 2. Tentar extrair de data-language
      else if (preEl.dataset.language) {
        lang = preEl.dataset.language;
      }
      // 3. Extrair das classes do <code>
      else {
        var codeClasses = (codeEl.className || "").split(/\s+/);
        var preClasses = (preEl.className || "").split(/\s+/);
        var allClasses = codeClasses.concat(preClasses);

        for (var i = 0; i < allClasses.length; i++) {
          var c = allClasses[i].trim();
          if (!c || c === "sourceCode" || c === "cell-code" || c === "code" || c === "language-") continue;
          if (c.startsWith("language-")) {
            lang = c.replace("language-", "");
            break;
          }
          // Classes diretas como "java", "bash", "yaml"
          if (/^(java|bash|sh|yaml|python|r|js|javascript|json|xml|html|css|sql|cpp|c|go|rust|kotlin|scala|groovy|php|ruby|perl|lua|vim|dockerfile|makefile|markdown|tex|bibtex|diff|regex|http|powershell|batch|shell)$/i.test(c)) {
            lang = c.toLowerCase();
            break;
          }
        }
      }

      // Se ainda não achou, tentar pelo id do div pai (ex: cb1 -> java)
      if (!lang) {
        var parent = preEl.closest("div[id^='cb']");
        if (parent) {
          var sibling = parent.querySelector(".code-label, [data-lang]");
          if (sibling) {
            lang = sibling.dataset.lang || sibling.textContent.trim().toLowerCase();
          }
        }
      }

      // Normalizar linguagens
      if (lang) {
        lang = lang.toLowerCase();
        if (lang === "sh") lang = "bash";
        if (lang === "shell") lang = "bash";
        if (lang === "yml") lang = "yaml";
        if (lang === "js") lang = "javascript";
        if (lang === "py") lang = "python";
      }

      // Limpar classes antigas do Pandoc/Quarto
      codeEl.removeAttribute("class");
      preEl.removeAttribute("class");

      // Aplicar classes do Prism
      if (lang && Prism.languages[lang]) {
        codeEl.className = "language-" + lang;
        preEl.className = "language-" + lang + " line-numbers";
      } else {
        codeEl.className = "language-text";
        preEl.className = "language-text line-numbers";
        if (lang) console.log("[Prism] Gramática não encontrada para:", lang);
      }

      // Preservar quebras de linha: o textContent já faz isso,
      // mas garantimos que não há spans de highlight antigos
      var texto = codeEl.textContent;
      codeEl.textContent = texto;
    });

    // Destacar com Prism
    if (window.Prism && Prism.highlightAll) {
      Prism.highlightAll();
      console.log("[Prism] Highlight aplicado.");
    } else {
      console.error("[Prism] Prism.highlightAll não disponível!");
    }
  }

  // Executar quando o DOM estiver pronto
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aplicarPrism);
  } else {
    // Já carregou — rodar imediatamente
    aplicarPrism();
  }
})();
</script>
